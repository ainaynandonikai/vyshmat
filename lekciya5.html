<script>
/* ===== ПОДПИСЬ (не менять) ===== */
const AUTHOR = { nick: "@ainaynandonikai", url: "https://github.com/ainaynandonikai" };

/* ===== ДАННЫЕ - меняется только этот объект ===== */
const DATA = {
  title: "Прямая на плоскости",
  subtitle: "Уравнения прямой в R², угловой коэффициент, середина отрезка, взаимное расположение прямых и разбор задачи про треугольник.",
  meta: ["Высшая математика", "Лекция 5", "4 темы", "образец задачи из контрольной"],
  topics: [
    {
      id: "k", name: "Основы",
      konspekt: `
        <p>Всякая прямая в R² задаётся уравнением первой степени от x и y. И наоборот: любое линейное уравнение - это прямая.</p>
        <h3>Аналогия: склон горки</h3>
        <p>Угловой коэффициент <code>k</code> - крутизна горки: сколько метров вверх на каждый метр вперёд. <code>k = 0</code> - ровная площадка, большой <code>k</code> - крутой подъём, отрицательный <code>k</code> - спуск. Число <code>b</code> - высота, на которой горка начинается (пересечение с осью y).</p>
        <h3>Формулы</h3>
        <pre>Ax + By + C = 0          общее уравнение прямой (1)
y = kx + b               с угловым коэффициентом (k = tg φ)
y − y₀ = k(x − x₀)       пучок прямых через точку M₀(x₀; y₀) (2)
k = (y₂ − y₁) / (x₂ − x₁)   k по двум точкам M₁, M₂ (2.3)
O((x₁+x₂)/2 ; (y₁+y₂)/2)    середина отрезка AB</pre>
        <ul>
          <li>Горизонтальная прямая: k = 0, уравнение y = y₀.</li>
          <li>Вертикальная прямая x = x₀ в пучок не входит - у неё нет k.</li>
          <li><b>Параллельны:</b> k₁ = k₂. <b>Перпендикулярны:</b> k₂ = −1/k₁.</li>
          <li>Угол между прямыми: tg φ = (k₂ − k₁) / (1 + k₁k₂), если 1 + k₁k₂ ≠ 0.</li>
        </ul>
        <div class="callout"><b>Главное:</b> чтобы написать уравнение прямой, нужна точка и k. Точка обычно дана, k ищем по двум точкам или по условию параллельности/перпендикулярности.</div>
        <h3>Пример 1</h3>
        <p>Прямая через A(3; 5) и B(−1; 7).</p>
        <pre>y − 5 = k(x − 3)
k = (7 − 5) / (−1 − 3) = 2/(−4) = −1/2
y − 5 = −1/2·(x − 3)  →  y = −x/2 + 13/2</pre>`,
      terms: [
        { term: "Общее уравнение прямой", def: "Ax + By + C = 0 - уравнение первой степени относительно x и y; выражает прямую линию." },
        { term: "Угловой коэффициент", def: "число k = tg φ в уравнении y = kx + b, где φ - угол наклона прямой к оси x." },
        { term: "Пучок прямых", def: "совокупность прямых, проходящих через данную точку M₀(x₀; y₀); уравнение y − y₀ = k(x − x₀)." }
      ],
      cards: [
        { front: "Общее уравнение прямой", back: "Ax + By + C = 0." },
        { front: "Прямая с угловым коэффициентом", back: "y = kx + b, где k = tg φ, b - отрезок на оси ординат." },
        { front: "Пучок прямых через M₀(x₀; y₀)", back: "y − y₀ = k(x − x₀)." },
        { front: "k по двум точкам", back: "k = (y₂ − y₁) / (x₂ − x₁)." },
        { front: "Середина отрезка AB", back: "((x₁ + x₂)/2 ; (y₁ + y₂)/2)." },
        { front: "Горизонтальная прямая", back: "k = 0, уравнение y = y₀." },
        { front: "Какая прямая не входит в пучок?", back: "Вертикальная x = x₀ - у неё нет углового коэффициента." }
      ],
      questions: [
        { type: "single", level: "easy", q: "Что показывает угловой коэффициент k?",
          options: [{ t: "Тангенс угла наклона прямой к оси x", correct: true }, { t: "Отрезок на оси y", correct: false }, { t: "Длину отрезка", correct: false }, { t: "Площадь", correct: false }],
          explain: "k = tg φ; b - это отрезок на оси ординат." },
        { type: "truefalse", level: "easy", q: "Уравнение вертикальной прямой можно записать как y = kx + b.", answer: false,
          explain: "Вертикальная прямая x = x₀ не имеет углового коэффициента." },

  const norm = (s) => String(s).toLowerCase().replace(/ё/g, "е").replace(/\s+/g, " ").replace(/[.,;!]+$/, "").trim();
  const TYPE = { single: "один ответ", multiple: "несколько", truefalse: "верно / неверно", fill: "вписать", match: "сопоставить" };
  const LEVEL = { easy: "лёгкий", med: "средний", hard: "сложный" };

  /* Шапка и подпись */
  document.title = DATA.title;
  $("#pageTitle").textContent = DATA.title;
  $("#pageSub").textContent = DATA.subtitle || "";
  (DATA.meta || []).forEach((m) => $("#pageMeta").appendChild(make("span", "chip", esc(m))));
  const au = $("#author"); au.href = AUTHOR.url; au.querySelector("b").textContent = AUTHOR.nick;
  $("#footer").innerHTML = 'Тренажёр собрал <a href="' + esc(AUTHOR.url) + '" target="_blank" rel="noopener">' + esc(AUTHOR.nick) + "</a>";

  /* Тема */
  const root = document.documentElement;
  const dark = () => root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  const savedTheme = store.get(KEY + ":theme", null);
  if (savedTheme) root.dataset.theme = savedTheme;
  const themeLabel = () => { $("#themeBtn").textContent = dark() ? "Светлая тема" : "Тёмная тема"; };
  $("#themeBtn").onclick = () => { const t = dark() ? "light" : "dark"; root.dataset.theme = t; store.set(KEY + ":theme", t); themeLabel(); };
  themeLabel();

  /* Фильтр тем */
  let topic = "all";
  const sel = () => topic === "all" ? DATA.topics : DATA.topics.filter((t) => t.id === topic);
  function renderTopics() {
    const box = $("#topics"); box.innerHTML = "";
    if (DATA.topics.length < 2) return;
    [{ id: "all", name: "Все темы" }].concat(DATA.topics).forEach((t) => {
      const b = make("button", "tchip", esc(t.name)); b.type = "button";
      b.setAttribute("aria-pressed", String(t.id === topic));
      b.onclick = () => { topic = t.id; renderAll(); };
      box.appendChild(b);
    });
  }

  /* Конспект */
  function renderKonspekt() {
    const p = $("#p-konspekt"); p.innerHTML = "";
    sel().forEach((t) => {
      const s = make("section", "sheet");
      s.appendChild(make("span", "kicker", "тема"));
      s.appendChild(make("h2", null, esc(t.name)));
      s.appendChild(make("div", null, t.konspekt || ""));
      p.appendChild(s);
    });
  }

  /* Тесты */
  let mode = "learn", level = "all", qs = [];
  function seg(boxId, items, cur, set) {
    const box = $(boxId); box.innerHTML = "";
    items.forEach(([v, label]) => {
      const b = make("button", null, label); b.type = "button";
      b.setAttribute("aria-pressed", String(v === cur));
      b.onclick = () => { set(v); renderTests(); };
      box.appendChild(b);
    });
  }
  function renderTests() {
    seg("#modeSeg", [["learn", "Учёба"], ["exam", "Экзамен"]], mode, (v) => { mode = v; });
    seg("#levelSeg", [["all", "Все"], ["easy", "Лёгкие"], ["med", "Средние"], ["hard", "Сложные"]], level, (v) => { level = v; });
    const list = $("#qlist"); list.innerHTML = "";
    qs = [];
    sel().forEach((t) => (t.questions || []).forEach((q) => { if (level === "all" || q.level === level) qs.push(q); }));
    $("#score").textContent = ""; $("#bar").style.width = "0";
    if (!qs.length) { list.appendChild(make("div", "empty", "Нет вопросов с таким фильтром")); return; }
    qs.forEach((q, i) => list.appendChild(renderQ(q, i)));
  }
  function renderQ(q, i) {
    const box = make("div", "q"); box.dataset.i = i;
    const head = make("div", "qhead");
    head.appendChild(make("span", "tag", (i + 1) + " · " + TYPE[q.type]));
    if (q.level) head.appendChild(make("span", "tag lvl-" + q.level, LEVEL[q.level] || q.level));
    box.appendChild(head);
    box.appendChild(make("p", "qtext", esc(q.q)));
    const name = "q" + i;
    if (q.type === "single" || q.type === "multiple") {
      const opts = make("div", "opts");
      shuffle(q.options.map((o, k) => ({ o, k }))).forEach(({ o, k }) => {
        const l = make("label", "opt"); l.dataset.k = k;
        const inp = document.createElement("input"); inp.type = q.type === "single" ? "radio" : "checkbox"; inp.name = name; inp.value = k; inp.id = name + "-" + k;
        l.appendChild(inp); l.appendChild(make("span", null, esc(o.t))); opts.appendChild(l);
      });
      box.appendChild(opts);
    } else if (q.type === "truefalse") {
      const opts = make("div", "opts");
      [["true", "Верно"], ["false", "Неверно"]].forEach(([v, t]) => {
        const l = make("label", "opt"); l.dataset.k = v;
        const inp = document.createElement("input"); inp.type = "radio"; inp.name = name; inp.value = v; inp.id = name + "-" + v;
        l.appendChild(inp); l.appendChild(make("span", null, t)); opts.appendChild(l);
      });
      box.appendChild(opts);
    } else if (q.type === "fill") {
      const inp = document.createElement("input"); inp.type = "text"; inp.id = name + "-fill"; inp.placeholder = "Твой ответ"; inp.autocomplete = "off";
      inp.onkeydown = (e) => { if (e.key === "Enter") check(box, q); };
      box.appendChild(inp);
    } else if (q.type === "match") {
      const rights = shuffle(q.pairs.map((p) => p.right));
      q.pairs.forEach((p, k) => {
        const row = make("div", "mrow");
        row.appendChild(make("span", "ml", esc(p.left)));
        const s = document.createElement("select"); s.id = name + "-m" + k;
        s.appendChild(new Option("выбери…", ""));
        rights.forEach((r) => s.appendChild(new Option(r, r)));
        row.appendChild(s); box.appendChild(row);
      });
    }
    const ex = make("div", "explain", "<b>Разбор:</b> " + esc(q.explain || "")); ex.hidden = true; box.appendChild(ex);
    if (mode === "learn") {
      const b = make("button", "btn ghost small", "Проверить"); b.type = "button";
      b.onclick = () => check(box, q); box.appendChild(b);
    }
    return box;
  }
  function check(box, q) {
    let ok = false;
    const labels = [...box.querySelectorAll(".opt")];
    labels.forEach((l) => l.classList.remove("o-ok", "o-bad"));
    if (q.type === "single" || q.type === "multiple") {
      const picked = new Set([...box.querySelectorAll("input:checked")].map((x) => +x.value));
      const right = new Set(q.options.map((o, k) => o.correct ? k : -1).filter((k) => k >= 0));
      ok = picked.size === right.size && [...picked].every((k) => right.has(k));
      labels.forEach((l) => { const k = +l.dataset.k; if (right.has(k)) l.classList.add("o-ok"); else if (picked.has(k)) l.classList.add("o-bad"); });
    } else if (q.type === "truefalse") {
      const p = box.querySelector("input:checked");
      ok = !!p && (p.value === "true") === q.answer;
      labels.forEach((l) => { const isRight = (l.dataset.k === "true") === q.answer; if (isRight) l.classList.add("o-ok"); else if (p && p.value === l.dataset.k) l.classList.add("o-bad"); });
    } else if (q.type === "fill") {
      const v = norm(box.querySelector("input").value);
      ok = v !== "" && q.answers.some((a) => norm(a) === v);
    } else if (q.type === "match") {
      ok = true;
      box.querySelectorAll("select").forEach((s, k) => { const good = s.value === q.pairs[k].right; s.classList.toggle("s-ok", good); s.classList.toggle("s-bad", !good); if (!good) ok = false; });
    }
    box.classList.toggle("is-ok", ok); box.classList.toggle("is-bad", !ok);
    box.querySelector(".explain").hidden = false;
    return ok;
  }
  $("#checkAll").onclick = () => {
    if (!qs.length) return;
    let n = 0;
    document.querySelectorAll("#qlist .q").forEach((box) => { if (check(box, qs[+box.dataset.i])) n++; });
    const pct = Math.round(n / qs.length * 100);
    $("#score").innerHTML = "<b>" + n + " / " + qs.length + "</b> · " + pct + "%";
    $("#bar").style.width = pct + "%";
  };
  $("#resetAll").onclick = () => renderTests();

  /* Карточки */
  let deck = [], idx = 0;
  let learned = new Set(store.get(KEY + ":learned", []));
  function renderCards(reshuffle) {
    const all = []; sel().forEach((t) => (t.cards || []).forEach((c) => all.push(c)));
    deck = reshuffle ? shuffle(all) : all; if (idx >= deck.length) idx = 0;
    drawCard();
  }
  function drawCard() {
    const box = $("#deck"); box.innerHTML = "";
    const n = deck.filter((c) => learned.has(c.front)).length;
    $("#learned").innerHTML = deck.length ? "Знаю: <b>" + n + "</b> из " + deck.length : "";
    if (!deck.length) { box.appendChild(make("div", "empty", "В этой теме нет карточек")); $("#counter").textContent = "0 / 0"; return; }
    const c = deck[idx];
    const fc = make("button", "fc"); fc.type = "button"; fc.setAttribute("aria-label", "Перевернуть карточку");
    const inner = make("div", "inner");
    const front = make("div", "face front", '<div class="t">' + esc(c.front) + '</div><span class="hint">нажми - ответ</span>');
    const back = make("div", "face back", '<div class="t">' + esc(c.back) + "</div>");
    if (learned.has(c.front)) front.appendChild(make("span", "learned-tag", "знаю"));
    inner.appendChild(front); inner.appendChild(back); fc.appendChild(inner);
    fc.onclick = () => fc.classList.toggle("flipped");
    box.appendChild(fc);
    $("#counter").textContent = (idx + 1) + " / " + deck.length;
  }
  const step = (d) => { if (!deck.length) return; idx = (idx + d + deck.length) % deck.length; drawCard(); };
  const mark = (on) => { if (!deck.length) return; const f = deck[idx].front; on ? learned.add(f) : learned.delete(f); store.set(KEY + ":learned", [...learned]); step(1); };
  $("#prev").onclick = () => step(-1);
  $("#next").onclick = () => step(1);
  $("#know").onclick = () => mark(true);
  $("#again").onclick = () => mark(false);
  $("#shuffle").onclick = () => { idx = 0; renderCards(true); };

  /* Определения */
  function renderOral() {
    const p = $("#p-oral"); p.innerHTML = "";
    sel().forEach((t) => {
      const s = make("section", "sheet");
      s.appendChild(make("span", "kicker", "тема"));
      s.appendChild(make("h2", null, esc(t.name)));
      if ((t.terms || []).length) {
        const g = make("div", "terms");
        t.terms.forEach((x) => g.appendChild(make("div", "term", "<b>" + esc(x.term) + "</b> - " + esc(x.def))));
        s.appendChild(g);
      }
      (t.oral || []).forEach((o) => {
        const d = document.createElement("details");
        d.appendChild(make("summary", null, esc(o.q)));
        d.appendChild(make("div", "ans", esc(o.a)));
        s.appendChild(d);
      });
      p.appendChild(s);
    });
  }

  /* Шпаргалка */
  function renderCheat() {
    const p = $("#p-cheat"); p.innerHTML = "";
    const s = make("section", "sheet cheat");
    s.appendChild(make("span", "kicker", "за час до пары"));
    s.appendChild(make("h2", null, "Шпаргалка"));
    sel().forEach((t) => {
      s.appendChild(make("h3", null, esc(t.name)));
      const ul = make("ul");
      (t.cheat || []).forEach((c) => ul.appendChild(make("li", null, c)));
      s.appendChild(ul);
    });
    p.appendChild(s);
  }

  /* Вкладки */
  const TABS = ["konspekt", "tests", "cards", "oral", "cheat"];
  function openTab(id) {
    if (!TABS.includes(id)) id = "konspekt";
    document.querySelectorAll(".tab").forEach((t) => t.setAttribute("aria-selected", String(t.dataset.tab === id)));
    TABS.forEach((t) => { $("#p-" + t).hidden = t !== id; });
    store.set(KEY + ":tab", id);
  }
  document.querySelectorAll(".tab").forEach((t) => { t.onclick = () => openTab(t.dataset.tab); });

  function renderAll() { renderTopics(); renderKonspekt(); renderTests(); renderCards(false); renderOral(); renderCheat(); }
  renderAll();
  openTab((location.hash || "").slice(1) || store.get(KEY + ":tab", "konspekt"));
})();
</script>
