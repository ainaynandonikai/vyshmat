<style>

    }
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --paper:#17201C; --grid:rgba(230,236,228,.045); --card:#1E2924; --card2:#24312B;
    --ink:#E5EBE3; --muted:#A6B2A9; --faint:#7A877E; --line:#2F3C35; --line2:#3E4D45;
    --accent:#8FB1FF; --accent-ink:#10182A; --accent-soft:rgba(143,177,255,.14);
    --margin:#FF8898; --margin-soft:rgba(255,136,152,.12); --hl:rgba(255,214,64,.22);
    --ok:#6FD29C; --ok-soft:rgba(111,210,156,.13); --bad:#FF8898; --bad-soft:rgba(255,136,152,.12); --warn:#E7B65B;

  body{margin:0;font-family:var(--body);font-size:16px;line-height:1.6;color:var(--ink);background-color:var(--paper);
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);

  .wrap{max-width:780px;margin:0 auto;padding:0 16px;padding-block:28px 64px;position:relative}

  .learned-tag{position:absolute;top:10px;right:12px;font-family:var(--mono);font-size:11px;color:var(--ok);border:1px solid var(--ok);border-radius:5px;padding:1px 6px}
  .deckbar{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}
  .nav{width:42px;height:42px;border-radius:50%;border:1px solid var(--line2);background:var(--card);color:var(--ink);font-size:18px;cursor:pointer}
  .counter{font-family:var(--mono);font-size:14px;color:var(--muted);min-width:64px;text-align:center;font-variant-numeric:tabular-nums}

  /* Определения */
  .terms{display:grid;gap:8px;margin:10px 0 4px}

<script>
/* ===== ПОДПИСЬ (не менять) ===== */
const AUTHOR = { nick: "@ainaynandonikai", url: "https://github.com/ainaynandonikai" };

/* ===== ДАННЫЕ - меняется только этот объект ===== */
const DATA = {
  title: "Системы линейных алгебраических уравнений",
  subtitle: "Метод Крамера, матричный метод, метод Гаусса, ранг матрицы, теорема Кронекера - Капелли и собственные значения - формулировки из лекции 2, задачи из лекции и ТР №1.",
  meta: ["Высшая математика", "Лекция 2", "6 тем", "примеры из лекции и ТР №1, вариант 16"],
  topics: [
    {
      id: "cramer", name: "Метод Крамера",
      konspekt: `
        <h3>Аналогия: замена игрока</h3>
        <p>Матрица системы - команда из трёх игроков-столбцов: столбец при x, при y, при z. Чтобы узнать x, тренер снимает с поля столбец x и <mark>выпускает вместо него столбец правых частей</mark>. Определитель новой команды - Δx. Делим его на определитель исходной команды Δ - получаем x.</p>
        <h3>Из лекции</h3>
        <p>Рассмотрим систему из 3-х алгебраических уравнений с 3-мя неизвестными:</p>
        <pre>a₁₁x + a₁₂y + a₁₃z = b₁
a₂₁x + a₂₂y + a₂₃z = b₂       (1.1)
a₃₁x + a₃₂y + a₃₃z = b₃</pre>
        <div class="callout"><b>Теорема.</b> Если определитель матрицы системы (1.1) Δ отличен от нуля (Δ ≠ 0), то система имеет единственное решение, определяемое формулами Крамера: x = Δx / Δ, y = Δy / Δ, z = Δz / Δ.</div>
        <pre>    | a₁₁  a₁₂  a₁₃ |
Δ = | a₂₁  a₂₂  a₂₃ |
    | a₃₁  a₃₂  a₃₃ |

     | b₁  a₁₂  a₁₃ |
Δx = | b₂  a₂₂  a₂₃ |
     | b₃  a₃₂  a₃₃ |

     | a₁₁  b₁  a₁₃ |
Δy = | a₂₁  b₂  a₂₃ |
     | a₃₁  b₃  a₃₃ |

     | a₁₁  a₁₂  b₁ |
Δz = | a₂₁  a₂₂  b₂ |
     | a₃₁  a₃₂  b₃ |</pre>
        <p>Словами: в Δx на месте столбца коэффициентов при x стоит столбец свободных членов b₁, b₂, b₃; в Δy - на месте столбца при y; в Δz - на месте столбца при z.</p>
        <h3>Пример 1 из лекции (образец задачи из контрольной работы)</h3>
        <p>Решить систему уравнений двумя способами. Способ 1 - метод Крамера. В лекции определители даны готовыми, здесь они расписаны по Саррюсу.</p>
        <pre>3x +  y − 2z = 1
2x − 2y +  z = 11
5x + 3y − 3z = −2

Δ = | 3   1  −2 |
    | 2  −2   1 |
    | 5   3  −3 |  =

3·(−2)·(−3) + 1·1·5 + (−2)·2·3 = 18 + 5 − 12 = 11
(−2)·(−2)·5 + 3·1·3 + 1·2·(−3) = 20 + 9 − 6 = 23
Δ = 11 − 23 = −12</pre>
        <pre>Δx = |  1   1  −2 |
     | 11  −2   1 |
     | −2   3  −3 |  =

1·(−2)·(−3) + 1·1·(−2) + (−2)·11·3 = 6 − 2 − 66 = −62
(−2)·(−2)·(−2) + 1·1·3 + 1·11·(−3) = −8 + 3 − 33 = −38
Δx = −62 − (−38) = −24</pre>
        <pre>Δy = | 3   1  −2 |
     | 2  11   1 |
     | 5  −2  −3 |  =

3·11·(−3) + 1·1·5 + (−2)·2·(−2) = −99 + 5 + 8 = −86
(−2)·11·5 + 3·1·(−2) + 1·2·(−3) = −110 − 6 − 6 = −122
Δy = −86 − (−122) = 36</pre>
        <pre>Δz = | 3   1   1 |
     | 2  −2  11 |
     | 5   3  −2 |  =

3·(−2)·(−2) + 1·11·5 + 1·2·3 = 12 + 55 + 6 = 73
1·(−2)·5 + 3·11·3 + 1·2·(−2) = −10 + 99 − 4 = 85
Δz = 73 − 85 = −12</pre>
        <pre>x = Δx / Δ = −24 / (−12) = 2
y = Δy / Δ = 36 / (−12)  = −3
z = Δz / Δ = −12 / (−12) = 1

Проверка:
3·2 − 3 − 2·1 = 1               верно
2·2 − 2·(−3) + 1 = 11           верно
5·2 + 3·(−3) − 3·1 = −2         верно</pre>
        <p>Ответ: x = 2, y = −3, z = 1.</p>
        <h3>ТР №1, вариант 16, задача 5а</h3>
        <pre> x₁ + 3x₂ − 2x₃ = −13

          options: [{ t: "A·x = λ·x", correct: true }, { t: "A·x = 0", correct: false }, { t: "A·x = x + λ", correct: false }, { t: "A·λ = x", correct: false }],
          explain: "Вектор x ≠ 0 называется собственным вектором матрицы A, если найдется такое число λ, что A·x = λ·x." },
        { type: "truefalse", level: "easy", q: "Собственный вектор может быть нулевым.", answer: false,
          explain: "В определении прямо сказано: вектор x ≠ 0." },
        { type: "fill", level: "med", q: "Характеристическое уравнение матрицы A: Δ(A − ___·E) = 0",
          answers: ["λ", "лямбда", "lambda", "l"], explain: "Δ(A − λE) = 0 - характеристическое уравнение, его корни - собственные значения." },

          explain: "(2 − λ)(−3 − λ) − 4·(−1) = λ² + λ − 6 + 4 = λ² + λ − 2. Ответ λ² + λ − 10 - если потерять минус у −1." },
        { type: "fill", level: "med", q: "Пример 8 лекции: собственные значения λ₁ = −2 и λ₂ = ___",
          answers: ["1"], explain: "λ² + λ − 2 = (λ + 2)(λ − 1) = 0, отсюда λ₁ = −2, λ₂ = 1." },
        { type: "truefalse", level: "hard", q: "В примере 8 вектор (−1; 1) - собственный для λ₁ = −2.", answer: true,
          explain: "A·(−1; 1) = (2·(−1) + 4·1; −1·(−1) − 3·1) = (2; −2) = −2·(−1; 1). Это вектор (−C; C) при C = 1." },
        { type: "match", level: "med", q: "Сопоставь понятие и запись.",

          explain: "Все записи - из лекции: (1.6), (1.7) и матричный вид системы." },
        { type: "multiple", level: "hard", q: "Пример 9 лекции: A = (1 −4 −8; −4 7 −4; −8 −4 1). Что верно?",
          options: [{ t: "λ = 9 - собственное значение", correct: true }, { t: "λ = −9 - собственное значение", correct: true }, { t: "(2; 1; 2) - собственный вектор для λ = −9", correct: true }, { t: "λ = 81 - собственное значение", correct: false }, { t: "(0; 0; 0) - собственный вектор", correct: false }],
          explain: "(λ − 9)(λ² − 81) = 0 даёт λ = 9 и λ = −9. A·(2; 1; 2) = (−18; −9; −18) = −9·(2; 1; 2). Нулевой вектор собственным не бывает." }
      ],
      oral: [
        { q: "Дайте определение собственного вектора и собственного значения матрицы.", a: "Вектор x ≠ 0 называется собственным вектором матрицы A, если найдется такое число λ, что A·x = λ·x. Число λ называется собственным значением матрицы A, соответствующим вектору x." },
        { q: "Дайте определение характеристического многочлена и характеристического уравнения.", a: "Определитель Δ(A − λE) является многочленом n-ой степени. Он называется характеристическим многочленом матрицы A, а уравнение Δ(A − λE) = 0 - характеристическим уравнением матрицы A." },
        { q: "Сформулируйте теорему о собственных значениях.", a: "Корни характеристического уравнения матрицы A (если они существуют) и только они являются собственными значениями этой матрицы." },
        { q: "Почему собственные значения ищут из условия Δ(A − λE) = 0?", a: "Равенство A·x = λ·x переписывается как (A − λE)·x = 0. Полученная система всегда имеет нулевое решение. Для существования ненулевого решения необходимо и достаточно, чтобы определитель системы обращался в нуль." }
      ],
      cheat: [
        "<b>A·x = λ·x</b>, x ≠ 0: x - собственный вектор, λ - собственное значение.",
        "<b>Δ(A − λE) = 0</b> - характеристическое уравнение; его корни и только они - собственные значения.",
        "Для каждого λ решаем (A − λE)·x = 0 методом Гаусса.",
        "Пример 8: λ = −2, 1; векторы (−C; C), (−4C; C). Пример 9: λ = 9, −9."

/* ===== ДВИЖОК (не менять) ===== */
(function () {
  const $ = (s) => document.querySelector(s);
  const make = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  const KEY = "trenazher:" + DATA.title;
  const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const norm = (s) => String(s).toLowerCase().replace(/ё/g, "е").replace(/\s+/g, " ").replace(/[.,;!]+$/, "").trim();
  const TYPE = { single: "один ответ", multiple: "несколько", truefalse: "верно / неверно", fill: "вписать", match: "сопоставить" };
  const LEVEL = { easy: "лёгкий", med: "средний", hard: "сложный" };

  /* Шапка и подпись */
  document.title = DATA.title;
  $("#pageTitle").textContent = DATA.title;
  $("#pageSub").textContent = DATA.subtitle || "";
  (DATA.meta || []).forEach((m) => $("#pageMeta").appendChild(make("span", "chip", esc(m))));
  const au = $("#author"); au.href = AUTHOR.url; au.querySelector("b").textContent = AUTHOR.nick;
  $("#footer").innerHTML = 'Тренажёр собрал <a href="' + esc(AUTHOR.url) + '" target="_blank" rel="noopener">' + esc(AUTHOR.nick) + "</a>";

  /* Тема */
  const root = document.documentElement;
  const dark = () => root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  const savedTheme = store.get(KEY + ":theme", null);
  if (savedTheme) root.dataset.theme = savedTheme;
  const themeLabel = () => { $("#themeBtn").textContent = dark() ? "Светлая тема" : "Тёмная тема"; };
  $("#themeBtn").onclick = () => { const t = dark() ? "light" : "dark"; root.dataset.theme = t; store.set(KEY + ":theme", t); themeLabel(); };
  themeLabel();

  /* Фильтр тем */
  let topic = "all";
  const sel = () => topic === "all" ? DATA.topics : DATA.topics.filter((t) => t.id === topic);
  function renderTopics() {
    const box = $("#topics"); box.innerHTML = "";
    if (DATA.topics.length < 2) return;
    [{ id: "all", name: "Все темы" }].concat(DATA.topics).forEach((t) => {
      const b = make("button", "tchip", esc(t.name)); b.type = "button";
      b.setAttribute("aria-pressed", String(t.id === topic));
      b.onclick = () => { topic = t.id; renderAll(); };
      box.appendChild(b);
    });
  }

  /* Конспект */
  function renderKonspekt() {
    const p = $("#p-konspekt"); p.innerHTML = "";
    sel().forEach((t) => {
      const s = make("section", "sheet");
      s.appendChild(make("span", "kicker", "тема"));
      s.appendChild(make("h2", null, esc(t.name)));
      s.appendChild(make("div", null, t.konspekt || ""));
      p.appendChild(s);
    });
  }

  /* Тесты */
  let mode = "learn", level = "all", qs = [];
  function seg(boxId, items, cur, set) {
    const box = $(boxId); box.innerHTML = "";
    items.forEach(([v, label]) => {
      const b = make("button", null, label); b.type = "button";
      b.setAttribute("aria-pressed", String(v === cur));
      b.onclick = () => { set(v); renderTests(); };
      box.appendChild(b);
    });
  }
  function renderTests() {
    seg("#modeSeg", [["learn", "Учёба"], ["exam", "Экзамен"]], mode, (v) => { mode = v; });
    seg("#levelSeg", [["all", "Все"], ["easy", "Лёгкие"], ["med", "Средние"], ["hard", "Сложные"]], level, (v) => { level = v; });
    const list = $("#qlist"); list.innerHTML = "";
    qs = [];
    sel().forEach((t) => (t.questions || []).forEach((q) => { if (level === "all" || q.level === level) qs.push(q); }));
    $("#score").textContent = ""; $("#bar").style.width = "0";
    if (!qs.length) { list.appendChild(make("div", "empty", "Нет вопросов с таким фильтром")); return; }
    qs.forEach((q, i) => list.appendChild(renderQ(q, i)));
  }
  function renderQ(q, i) {
    const box = make("div", "q"); box.dataset.i = i;
    const head = make("div", "qhead");
    head.appendChild(make("span", "tag", (i + 1) + " · " + TYPE[q.type]));
    if (q.level) head.appendChild(make("span", "tag lvl-" + q.level, LEVEL[q.level] || q.level));
    box.appendChild(head);
    box.appendChild(make("p", "qtext", esc(q.q)));
    const name = "q" + i;
    if (q.type === "single" || q.type === "multiple") {
      const opts = make("div", "opts");
      shuffle(q.options.map((o, k) => ({ o, k }))).forEach(({ o, k }) => {
        const l = make("label", "opt"); l.dataset.k = k;
        const inp = document.createElement("input"); inp.type = q.type === "single" ? "radio" : "checkbox"; inp.name = name; inp.value = k; inp.id = name + "-" + k;
        l.appendChild(inp); l.appendChild(make("span", null, esc(o.t))); opts.appendChild(l);
      });
      box.appendChild(opts);
    } else if (q.type === "truefalse") {
      const opts = make("div", "opts");
      [["true", "Верно"], ["false", "Неверно"]].forEach(([v, t]) => {
        const l = make("label", "opt"); l.dataset.k = v;
        const inp = document.createElement("input"); inp.type = "radio"; inp.name = name; inp.value = v; inp.id = name + "-" + v;
        l.appendChild(inp); l.appendChild(make("span", null, t)); opts.appendChild(l);
      });
      box.appendChild(opts);
    } else if (q.type === "fill") {
      const inp = document.createElement("input"); inp.type = "text"; inp.id = name + "-fill"; inp.placeholder = "Твой ответ"; inp.autocomplete = "off";
      inp.onkeydown = (e) => { if (e.key === "Enter") check(box, q); };
      box.appendChild(inp);
    } else if (q.type === "match") {
      const rights = shuffle(q.pairs.map((p) => p.right));
      q.pairs.forEach((p, k) => {
        const row = make("div", "mrow");
        row.appendChild(make("span", "ml", esc(p.left)));
        const s = document.createElement("select"); s.id = name + "-m" + k;
        s.appendChild(new Option("выбери…", ""));
        rights.forEach((r) => s.appendChild(new Option(r, r)));
        row.appendChild(s); box.appendChild(row);
      });
    }
    const ex = make("div", "explain", "<b>Разбор:</b> " + esc(q.explain || "")); ex.hidden = true; box.appendChild(ex);
    if (mode === "learn") {
      const b = make("button", "btn ghost small", "Проверить"); b.type = "button";
      b.onclick = () => check(box, q); box.appendChild(b);
    }
    return box;
  }
  function check(box, q) {
    let ok = false;
    const labels = [...box.querySelectorAll(".opt")];
    labels.forEach((l) => l.classList.remove("o-ok", "o-bad"));
    if (q.type === "single" || q.type === "multiple") {
      const picked = new Set([...box.querySelectorAll("input:checked")].map((x) => +x.value));
      const right = new Set(q.options.map((o, k) => o.correct ? k : -1).filter((k) => k >= 0));
      ok = picked.size === right.size && [...picked].every((k) => right.has(k));
      labels.forEach((l) => { const k = +l.dataset.k; if (right.has(k)) l.classList.add("o-ok"); else if (picked.has(k)) l.classList.add("o-bad"); });
    } else if (q.type === "truefalse") {
      const p = box.querySelector("input:checked");
      ok = !!p && (p.value === "true") === q.answer;
      labels.forEach((l) => { const isRight = (l.dataset.k === "true") === q.answer; if (isRight) l.classList.add("o-ok"); else if (p && p.value === l.dataset.k) l.classList.add("o-bad"); });
    } else if (q.type === "fill") {
      const v = norm(box.querySelector("input").value);
      ok = v !== "" && q.answers.some((a) => norm(a) === v);
    } else if (q.type === "match") {
      ok = true;
      box.querySelectorAll("select").forEach((s, k) => { const good = s.value === q.pairs[k].right; s.classList.toggle("s-ok", good); s.classList.toggle("s-bad", !good); if (!good) ok = false; });
    }
    box.classList.toggle("is-ok", ok); box.classList.toggle("is-bad", !ok);
    box.querySelector(".explain").hidden = false;
    return ok;
  }
  $("#checkAll").onclick = () => {
    if (!qs.length) return;
    let n = 0;
    document.querySelectorAll("#qlist .q").forEach((box) => { if (check(box, qs[+box.dataset.i])) n++; });
    const pct = Math.round(n / qs.length * 100);
    $("#score").innerHTML = "<b>" + n + " / " + qs.length + "</b> · " + pct + "%";
    $("#bar").style.width = pct + "%";
  };
  $("#resetAll").onclick = () => renderTests();

  /* Карточки */
  let deck = [], idx = 0;
  let learned = new Set(store.get(KEY + ":learned", []));
  function renderCards(reshuffle) {
    const all = []; sel().forEach((t) => (t.cards || []).forEach((c) => all.push(c)));
    deck = reshuffle ? shuffle(all) : all; if (idx >= deck.length) idx = 0;
    drawCard();
  }
  function drawCard() {
    const box = $("#deck"); box.innerHTML = "";
    const n = deck.filter((c) => learned.has(c.front)).length;
    $("#learned").innerHTML = deck.length ? "Знаю: <b>" + n + "</b> из " + deck.length : "";
    if (!deck.length) { box.appendChild(make("div", "empty", "В этой теме нет карточек")); $("#counter").textContent = "0 / 0"; return; }
    const c = deck[idx];
    const fc = make("button", "fc"); fc.type = "button"; fc.setAttribute("aria-label", "Перевернуть карточку");
    const inner = make("div", "inner");
    const front = make("div", "face front", '<div class="t">' + esc(c.front) + '</div><span class="hint">нажми - ответ</span>');
    const back = make("div", "face back", '<div class="t">' + esc(c.back) + "</div>");
    if (learned.has(c.front)) front.appendChild(make("span", "learned-tag", "знаю"));
    inner.appendChild(front); inner.appendChild(back); fc.appendChild(inner);
    fc.onclick = () => fc.classList.toggle("flipped");
    box.appendChild(fc);
    $("#counter").textContent = (idx + 1) + " / " + deck.length;
  }
  const step = (d) => { if (!deck.length) return; idx = (idx + d + deck.length) % deck.length; drawCard(); };
  const mark = (on) => { if (!deck.length) return; const f = deck[idx].front; on ? learned.add(f) : learned.delete(f); store.set(KEY + ":learned", [...learned]); step(1); };
  $("#prev").onclick = () => step(-1);
  $("#next").onclick = () => step(1);
  $("#know").onclick = () => mark(true);
  $("#again").onclick = () => mark(false);
  $("#shuffle").onclick = () => { idx = 0; renderCards(true); };

  /* Определения */
  function renderOral() {
    const p = $("#p-oral"); p.innerHTML = "";
    sel().forEach((t) => {
      const s = make("section", "sheet");
      s.appendChild(make("span", "kicker", "тема"));
      s.appendChild(make("h2", null, esc(t.name)));
      if ((t.terms || []).length) {
        const g = make("div", "terms");
        t.terms.forEach((x) => g.appendChild(make("div", "term", "<b>" + esc(x.term) + "</b> - " + esc(x.def))));
        s.appendChild(g);
      }
      (t.oral || []).forEach((o) => {
        const d = document.createElement("details");
        d.appendChild(make("summary", null, esc(o.q)));
        d.appendChild(make("div", "ans", esc(o.a)));
        s.appendChild(d);
      });
      p.appendChild(s);
    });
  }

  /* Шпаргалка */
  function renderCheat() {
    const p = $("#p-cheat"); p.innerHTML = "";
    const s = make("section", "sheet cheat");
    s.appendChild(make("span", "kicker", "за час до пары"));
    s.appendChild(make("h2", null, "Шпаргалка"));
    sel().forEach((t) => {
      s.appendChild(make("h3", null, esc(t.name)));
      const ul = make("ul");
      (t.cheat || []).forEach((c) => ul.appendChild(make("li", null, c)));
      s.appendChild(ul);
    });
    p.appendChild(s);
  }

  /* Вкладки */
  const TABS = ["konspekt", "tests", "cards", "oral", "cheat"];
  function openTab(id) {
    if (!TABS.includes(id)) id = "konspekt";
    document.querySelectorAll(".tab").forEach((t) => t.setAttribute("aria-selected", String(t.dataset.tab === id)));
    TABS.forEach((t) => { $("#p-" + t).hidden = t !== id; });
    store.set(KEY + ":tab", id);
  }
  document.querySelectorAll(".tab").forEach((t) => { t.onclick = () => openTab(t.dataset.tab); });

  function renderAll() { renderTopics(); renderKonspekt(); renderTests(); renderCards(false); renderOral(); renderCheat(); }
  renderAll();
  openTab((location.hash || "").slice(1) || store.get(KEY + ":tab", "konspekt"));
})();
</script>
