<script>
/* ===== ПОДПИСЬ (не менять) ===== */
const AUTHOR = { nick: "@ainaynandonikai", url: "https://github.com/ainaynandonikai" };

/* ===== ДАННЫЕ - меняется только этот объект ===== */
const DATA = {
  title: "Произведения векторов",
  subtitle: "Скалярное, векторное и смешанное произведение: что каждое считает, как его найти и где встречается в типовом расчёте.",
  meta: ["Высшая математика", "Лекция 4", "3 темы", "примеры из ТР №1"],
  topics: [
    {
      id: "scal", name: "Скалярное",
      konspekt: `
        <p>Три произведения отвечают на три разных вопроса: <b>длины и углы</b> - скалярное, <b>площади</b> - векторное, <b>объёмы</b> - смешанное.</p>
        <h3>Аналогия: тень от палки</h3>
        <p>Вектор <code>b</code> - фонарик, светящий строго вниз, вектор <code>a</code> - палка под углом. Скалярное произведение - длина тени палки на направление <code>b</code>. Палка вдоль луча - тень максимальная. Палка поперёк луча - <mark>тени нет, произведение равно 0</mark>.</p>
        <h3>Формулы</h3>
        <pre>a·b = a₁b₁ + a₂b₂ + … + aₙbₙ     (результат - число)
|a| = √(a·a)                    (норма, длина вектора)
cos φ = (a·b) / (|a|·|b|)       (угол между векторами)</pre>
        <div class="callout"><b>Главное:</b> a ⊥ b тогда и только тогда, когда a·b = 0. Это самый частый тип задач.</div>
        <h3>Пример</h3>
        <p>При каком x векторы a = (2, 3, x) и b = (x, −1, 5) ортогональны?</p>
        <pre>a·b = 2x − 3 + 5x = 0  →  7x = 3  →  x = 3/7</pre>`,
      terms: [
        { term: "Скалярное произведение", def: "сумма попарных произведений координат: a·b = a₁b₁ + … + aₙbₙ. Результат - число." },
        { term: "Норма вектора", def: "длина вектора: |a| = √(a·a)." },
        { term: "Ортогональность", def: "перпендикулярность векторов; признак - a·b = 0." }
      ],
      cards: [
        { front: "a·b - что на выходе?", back: "Число: a₁b₁ + a₂b₂ + … + aₙbₙ." },
        { front: "Длина (норма) вектора", back: "|a| = √(a·a)." },
        { front: "Косинус угла между векторами", back: "cos φ = (a·b) / (|a|·|b|)." },
        { front: "Признак перпендикулярности", back: "a ⊥ b  ⟺  a·b = 0 - «тени нет»." }
      ],
      questions: [
        { type: "single", level: "easy", q: "Что получается в результате скалярного произведения?",
          options: [{ t: "Число", correct: true }, { t: "Вектор", correct: false }, { t: "Матрица", correct: false }, { t: "Площадь параллелограмма", correct: false }],
          explain: "Скалярное произведение - сумма произведений координат, то есть число." },
        { type: "truefalse", level: "easy", q: "Если a·b = 0, то векторы a и b перпендикулярны.", answer: true,
          explain: "Да: нулевое скалярное произведение - признак ортогональности." },
        { type: "single", level: "med", q: "Как найти косинус угла между векторами a и b?",
          options: [{ t: "(a·b) / (|a|·|b|)", correct: true }, { t: "(|a|·|b|) / (a·b)", correct: false }, { t: "|a×b| / (|a|·|b|)", correct: false }, { t: "a·b·|a|", correct: false }],
          explain: "cos φ = (a·b) / (|a|·|b|)." },
        { type: "truefalse", level: "med", q: "Длина вектора равна a·a.", answer: false,
          explain: "Длина - корень: |a| = √(a·a)." },
        { type: "fill", level: "hard", q: "При каком x векторы a = (2, 3, x) и b = (x, −1, 5) ортогональны? x = ___",
          answers: ["3/7"], explain: "a·b = 2x − 3 + 5x = 7x − 3 = 0, отсюда x = 3/7." }
      ],
      oral: [
        { q: "Дайте определение скалярного произведения.", a: "Скалярное произведение векторов a и b - число, равное сумме попарных произведений их координат: a·b = a₁b₁ + a₂b₂ + … + aₙbₙ." },
        { q: "Что значит геометрически, что скалярное произведение равно нулю?", a: "Векторы перпендикулярны (ортогональны): проекция одного на другой - «тень» - равна нулю." }
      ],
      cheat: [
        "<b>a·b</b> = a₁b₁ + … + aₙbₙ - число.",
        "<b>|a|</b> = √(a·a); <b>cos φ</b> = (a·b) / (|a|·|b|).",

  $("#shuffle").onclick = () => { idx = 0; renderCards(true); };

  /* Определения */
  function renderOral() {
    const p = $("#p-oral"); p.innerHTML = "";
    sel().forEach((t) => {
      const s = make("section", "sheet");
      s.appendChild(make("span", "kicker", "тема"));
      s.appendChild(make("h2", null, esc(t.name)));
      if ((t.terms || []).length) {
        const g = make("div", "terms");
        t.terms.forEach((x) => g.appendChild(make("div", "term", "<b>" + esc(x.term) + "</b> - " + esc(x.def))));
        s.appendChild(g);
      }
      (t.oral || []).forEach((o) => {
        const d = document.createElement("details");
        d.appendChild(make("summary", null, esc(o.q)));
        d.appendChild(make("div", "ans", esc(o.a)));
        s.appendChild(d);
      });
      p.appendChild(s);
    });
  }

  /* Шпаргалка */
  function renderCheat() {
    const p = $("#p-cheat"); p.innerHTML = "";
    const s = make("section", "sheet cheat");
    s.appendChild(make("span", "kicker", "за час до пары"));
    s.appendChild(make("h2", null, "Шпаргалка"));
    sel().forEach((t) => {
      s.appendChild(make("h3", null, esc(t.name)));
      const ul = make("ul");
      (t.cheat || []).forEach((c) => ul.appendChild(make("li", null, c)));
      s.appendChild(ul);
    });
    p.appendChild(s);
  }

  /* Вкладки */
  const TABS = ["konspekt", "tests", "cards", "oral", "cheat"];
  function openTab(id) {
    if (!TABS.includes(id)) id = "konspekt";
    document.querySelectorAll(".tab").forEach((t) => t.setAttribute("aria-selected", String(t.dataset.tab === id)));
    TABS.forEach((t) => { $("#p-" + t).hidden = t !== id; });
    store.set(KEY + ":tab", id);
  }
  document.querySelectorAll(".tab").forEach((t) => { t.onclick = () => openTab(t.dataset.tab); });

  function renderAll() { renderTopics(); renderKonspekt(); renderTests(); renderCards(false); renderOral(); renderCheat(); }
  renderAll();
  openTab((location.hash || "").slice(1) || store.get(KEY + ":tab", "konspekt"));
})();
</script>
